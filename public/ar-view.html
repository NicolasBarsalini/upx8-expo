<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Visualização AR</title>

  <!-- model-viewer oficial -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>

  <style>
    html, body { margin:0; height:100%; background:#000; overflow:hidden; }
    model-viewer { width:100%; height:100%; background:#000; }
    #loading {
      position:fixed; inset:0; display:flex; justify-content:center; align-items:center;
      color:white; font-family:Arial; background:black; z-index:10;
    }
    #loading.hide { opacity:0; pointer-events:none; }
  </style>
</head>

<body>
  <div id="loading">Carregando modelo…</div>

  <model-viewer id="viewer"
    ar
    ar-modes="scene-viewer webxr quick-look"
    camera-controls
    xr-environment
    auto-rotate
    autoplay
    ar-placement="floor"
    shadow-intensity="1"
    exposure="1.1">
  </model-viewer>

  <script>
    const viewer = document.querySelector("#viewer");
    const loading = document.querySelector("#loading");

    const qs = new URLSearchParams(window.location.search);
    const modelUrl = qs.get("model");

    if (!modelUrl) {
      loading.innerText = "ERRO: Nenhum modelo informado.";
    } else {
      viewer.src = modelUrl;   // ESSENCIAL
    }

    viewer.addEventListener("load", () => {
      loading.classList.add("hide");
      console.log("Modelo carregado:", modelUrl);
    });

    viewer.addEventListener("error", (e) => {
      loading.innerText = "Falha ao carregar o modelo.";
      console.error(e);
    });
  </script>
</body>
</html>
