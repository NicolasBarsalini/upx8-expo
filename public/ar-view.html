<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">

  <title>Visualização AR</title>

  <!-- model-viewer oficial -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: #000;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: Arial;
      background: black;
      z-index: 10;
      font-size: 18px;
    }

    #loading.hide {
      opacity: 0;
      pointer-events: none;
    }

    /* botão AR */
    #ar-button {
      background-color: #2E8376;
      border: none;
      color: white;
      padding: 12px 18px;
      font-size: 16px;
      border-radius: 8px;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      cursor: pointer;
    }

    #ar-prompt {
      position: absolute;
      left: 50%;
      bottom: 90px;
      transform: translateX(-50%);
      opacity: 0.8;
      z-index: 20;
    }
  </style>
</head>

<body>

  <div id="loading">Carregando modelo…</div>

  <model-viewer id="viewer"
    ar
    ar-modes="scene-viewer webxr quick-look"
    camera-controls
    xr-environment
    tone-mapping="neutral"
    shadow-intensity="1"
    auto-rotate
    autoplay>

    <button slot="ar-button" id="ar-button">
      Ver em seu espaço
    </button>

    <div id="ar-prompt">
      <img src="https://modelviewer.dev/shared-assets/icons/hand.png" width="60">
    </div>

  </model-viewer>

  <script>
    const viewer = document.querySelector("#viewer");
    const loading = document.querySelector("#loading");

    const qs = new URLSearchParams(window.location.search);
    const modelUrl = qs.get("model");

    if (!modelUrl) {
      loading.innerText = "ERRO: Nenhum modelo informado.";
    } else {
      viewer.src = modelUrl;   // ESSENCIAL
    }

    viewer.addEventListener("load", () => {
      loading.classList.add("hide");
      console.log("Modelo carregado:", modelUrl);
    });

    viewer.addEventListener("error", (e) => {
      loading.innerText = "Falha ao carregar o modelo.";
      console.error(e);
    });
  </script>

</body>
</html>
